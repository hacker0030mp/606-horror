<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์รวมเว็บสยองขวัญ - โฟลเดอร์หลัก</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #020202;
            color: #d1d5db;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: #0a0a0a;
            border-bottom: 2px solid #550000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 100;
        }
        h1 {
            font-size: 1.1rem;
            color: #ff3333;
            letter-spacing: 2px;
        }
        .nav-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: #150000;
            border: 1px solid #770000;
            color: #ff9999;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            border-radius: 4px;
        }
        .nav-btn:hover, .nav-btn.active {
            background: #660000;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .viewport-container {
            flex: 1;
            width: 100%;
            background: #000;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>📁 โฟลเดอร์: เว็บสยองขวัญ (Hub System)</h1>
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="switchPage('CCTV index.html', this)">1. ระบบกล้อง (CCTV)</button>
            <button class="nav-btn" onclick="switchPage('2. room_zero_tragic_horror.html', this)">2. ห้องที่ 0</button>
            <button class="nav-btn" onclick="switchPage('3. scary.html', this)">3. ความว่างเปล่า</button>
            <button class="nav-btn" onclick="switchPage('4. ending.html', this)">4. ฉากจบ (Ending)</button>
        </div>
    </header>

    <div class="viewport-container">
        <!-- โหลดหน้า CCTV เป็นค่าเริ่มต้น -->
        <iframe id="contentFrame" src="CCTV index.html"></iframe>
    </div>

    <script>
        function switchPage(filename, btnElement) {
            document.getElementById('contentFrame').src = filename;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            btnElement.classList.add('active');
        }
        
        <!-- เมนูข้ามฉากแบบไม่ใช้ JavaScript (Pure HTML) -->
<div style="background: #111; padding: 15px; border: 1px solid #ff0000; font-family: sans-serif; text-align: center; margin: 20px 0;">
    <h3 style="color: #ff0000; margin-top: 0;">🔻 ระบบข้ามฉาก / Skip Navigation 🔻</h3>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html.html" style="color: #fff; background: #333; padding: 8px 12px; text-decoration: none; border-radius: 4px;">หน้าหลัก (Index)</a>
        <a href="1. The Void Containment System.html" style="color: #fff; background: #333; padding: 8px 12px; text-decoration: none; border-radius: 4px;">ฉาก 1: The Void</a>
        <a href="2. room_zero_tragic_horror.html" style="color: #fff; background: #333; padding: 8px 12px; text-decoration: none; border-radius: 4px;">ฉาก 2: Room Zero</a>
        <a href="3. scary.html" style="color: #fff; background: #333; padding: 8px 12px; text-decoration: none; border-radius: 4px;">ฉาก 3: Scary</a>
        <a href="4. end ing.html" style="color: #fff; background: #333; padding: 8px 12px; text-decoration: none; border-radius: 4px;">ฉาก 4: Ending</a>
        <a href="CCTV index.html" style="color: #fff; background: #333; padding: 8px 12px; text-decoration: none; border-radius: 4px;">กล้อง CCTV</a>
    </div>
</div>

        
    </script>

</body>
</html>
